name: SSRuntime
options:
  bundleIdPrefix: com.zer0state
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
# SurveillanceCore is consumed as the local Swift package, not rebuilt as an
# Xcode framework target. `BundledResource` loads the spec contracts and
# fixtures through `Bundle.module`, which only exists for SwiftPM resource
# targets; a framework target has no `Bundle.module` and would not ship
# `Resources/contracts` at all. Package tests run via `swift test` (CI
# core lane) and are not hosted in an iOS test bundle.
packages:
  SurveillanceCore:
    path: .
targets:
  SSRuntime:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SurveillanceCore
        product: SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zer0state.surveillancesurvivor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SSRuntimeTests

  # App/ is built by XcodeGen and was never compiled by `swift test`, so touch
  # routing, input, and HUD interaction had no automated coverage at all — the
  # shared root cause of the upgrade-gate restart (#65) and the never-called
  # TouchController.reset() (#66). These types need UIKit and SpriteKit, so they
  # cannot be hosted in the SwiftPM package; they are tested here instead, on a
  # simulator, exactly as they ship.
  SSRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: SSRuntime
