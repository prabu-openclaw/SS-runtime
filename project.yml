name: SSRuntime
options:
  bundleIdPrefix: com.zer0state
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  SurveillanceCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zer0state.surveillancesurvivor.core
        DEFINES_MODULE: YES
  SSRuntime:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zer0state.surveillancesurvivor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SurveillanceCoreTests
  SurveillanceCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SurveillanceCoreTests
    dependencies:
      - target: SurveillanceCore
